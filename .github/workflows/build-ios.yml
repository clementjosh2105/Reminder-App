name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager (Force CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Configure iOS Deployment Target in Podfile
        run: |
          python3 -c "
          import os, re
          podfile_path = 'ios/Podfile'
          if os.path.exists(podfile_path):
              content = open(podfile_path).read()
              content = re.sub(r'#?\s*platform\s*:ios,\s*[\'\"]\d+(\.\d+)?[\'\"]', \"platform :ios, '13.0'\", content)
              open(podfile_path, 'w').write(content)
              print('Podfile updated to iOS 13.0 successfully!')
          else:
              print('Podfile not found!')
          "

      - name: Build iOS App Bundle (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Pack into IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: Runner.ipa
